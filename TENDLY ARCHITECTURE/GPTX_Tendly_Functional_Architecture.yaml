  declared_original_agents:
  - CitationValidatorAgent
  - ExportAgent
  - SectionGeneratorAgent
  reconstructed_probe_roles:
  - ProbePlanner
  - ControlledQueryRunner
  - EvidenceLedger
  - HypothesisTracker
  - DifferentialComparator
  - SchemaSynthesizer
  - ReportExporter
  boundary: Only operate on public/authorized observations; mark prompt-simulated reasoning; no claim of privileged
    Tendly tool or runtime access.
validation_tests:
- id: T01
  test: Explorer CPV hierarchy strictness
  criteria: LT + 72000000 descendants only
  negative_control: 9930587/35120000
  pass: negative control absent; each result has at least one matching official CPV
  requires: real Explorer results and export
- id: T02
  test: Explorer secondary CPV semantics
  criteria: result qualifies only under secondary descendant
  pass: included when secondary matching documented
  requires: source notices + export
- id: T03
  test: Chat vs Explorer relevance
  criteria: same country/period/CPV; compare exact/related labels
  pass: differences categorized, not conflated
  requires: both result sets
- id: T04
  test: UK2 stage exclusion
  criteria: UK biddable search
  negative_control: T-2052111748
  pass: market engagement not labeled open for bidding
  requires: Explorer execution
- id: T05
  test: Event-specific deadline mapping
  criteria: DORS+ Oct 29 engagement vs Nov 23 publication
  pass: distinct event labels, no generic bid countdown from publication date
  requires: full detail and filter snapshot
- id: T06
  test: Score repeatability
  criteria: same profile/country/notice snapshot
  pass: same deterministic matching score and tier
  requires: match run record
- id: T07
  test: Match ranking weights
  criteria: title vs description vs category keyword placement
  pass: relative scores follow guide-described order; exact weights not assumed
  requires: controlled profile runs
- id: T08
  test: Saved-alert dedup
  criteria: overlapping hourly scans
  pass: at most one email per tender per alert
  requires: alert notification log
- id: T09
  test: Calendar questions-date caveat
  criteria: estimated Q&A deadline
  pass: label clearly estimated, source distinction preserved
  requires: calendar view
- id: T10
  test: Document review acceptance
  criteria: reject and accept change cards
  pass: only accepted edits persist
  requires: user-authorized test document
- id: T11
  test: Company analytics award meaning
  criteria: buyer and seller awarded notices
  pass: no inferred win rate from wins alone
  requires: published award sources
- id: T12
  test: Export schema field fidelity
  criteria: CSV exported from same Explorer filtered view
  pass: exact header names and values audited without invention
  requires: actual CSV or XLSX
- id: T13
  test: Context exclusion parser
  criteria: same query with/without 'do not use records from earlier conversations'
  pass: compare returned record IDs and unexpected token exclusions
  requires: fresh independent chats
